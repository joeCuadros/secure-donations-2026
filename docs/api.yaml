openapi: 3.1.0
info:
  title: API Plataforma de Donaciones Seguras
  version: 1.0.0
  description: |
    Especificación OpenAPI 3.1 de la Plataforma de Donaciones Seguras (2026), prototipo académico con
    donaciones **simuladas** (no se procesa ningún pago real).

    Implementada sobre Amazon API Gateway HTTP API, AWS Lambda (Node.js 24), Amazon Cognito, Amazon
    Verified Permissions y Amazon DynamoDB. El contrato refleja los handlers de `backend/src` y la plantilla
    `infra/template.yaml`.

    **Autenticación.** Las rutas protegidas exigen `Authorization: Bearer <access_token>` emitido por el
    user pool de Cognito. API Gateway valida emisor, firma, expiración y `client_id`, y exige el scope de la
    ruta; después Lambda vuelve a verificar el scope y el Policy Engine (Verified Permissions) decide por
    grupo (`cognito:groups`) y propietario del recurso.

    **Formato de errores.** Los errores generados por Lambda tienen la forma `{ code, message, requestId }`
    (`ErrorPayload`). Los errores generados por API Gateway antes de invocar a Lambda (401 por token ausente
    o inválido, 403 por scope, 429 por límite de tasa) tienen la forma `{ "message": "..." }`
    (`GatewayMessage`).

    **Límite de tasa.** El stage aplica 10 solicitudes por segundo con ráfaga de 20 a todas las rutas
    (`DefaultRouteSettings` en `infra/template.yaml`).
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/{stage}
    description: API Gateway HTTP API (despliegue académico de referencia)
    variables:
      apiId:
        default: ueln2jhpja
      region:
        default: us-east-2
      stage:
        default: academic

tags:
  - name: Proyectos
  - name: Donaciones
  - name: Auditoría

paths:
  /v1/projects:
    get:
      tags: [Proyectos]
      summary: Catálogo público de proyectos
      description: Lista únicamente proyectos en estado PUBLICADO, del más reciente al más antiguo.
      operationId: listProjects
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/NextToken'
      responses:
        '200':
          description: Página de proyectos PUBLICADO (puede ser una lista vacía).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Proyectos]
      summary: Crear un proyecto de donación (estado BORRADOR)
      description: |
        Solo el grupo GESTOR. Registra un evento de auditoría `CREATE_PROJECT` con el resultado de la
        solicitud (`SUCCESS`, o `DENIED`, `FAILURE` o `ERROR` si se rechaza después de autenticar).
      operationId: createProject
      security:
        - CognitoBearer: [api/projects.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Proyecto creado en estado BORRADOR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/projects/{projectId}:
    get:
      tags: [Proyectos]
      summary: Detalle de un proyecto publicado
      description: |
        Un identificador inexistente y un proyecto en BORRADOR devuelven la misma respuesta 404, de modo que
        un visitante no puede distinguir ambos casos.
      operationId: getProject
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Detalle del proyecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/projects/{projectId}/stats:
    get:
      tags: [Proyectos]
      summary: Avance de recaudación de un proyecto publicado
      description: Solo cuenta donaciones en estado CONFIRMADA_SIMULADA. No expone datos de donantes.
      operationId: getProjectStats
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Métricas de recaudación del proyecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStatsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/projects/{projectId}/publish:
    patch:
      tags: [Proyectos]
      summary: Publicar un proyecto (BORRADOR a PUBLICADO)
      description: |
        Solo el grupo GESTOR. La actualización está condicionada a `status = BORRADOR`; publicar un proyecto
        ya publicado, o publicarlo de forma concurrente, devuelve 409. Registra un evento de auditoría
        `PUBLISH_PROJECT` con el resultado de la solicitud, incluidos los rechazos.
      operationId: publishProject
      security:
        - CognitoBearer: [api/projects.write]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Proyecto publicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/donations:
    post:
      tags: [Donaciones]
      summary: Registrar una intención de donación simulada (idempotente)
      description: |
        Solo el grupo DONANTE. La cabecera `Idempotency-Key` (UUID) es obligatoria. `donorSub` se toma del
        token, nunca del cuerpo.

        - Misma clave y mismo cuerpo: se devuelve la respuesta almacenada (201 con el mismo cuerpo) y no se
          crea otra donación.
        - Misma clave y cuerpo distinto: 409.
        - Proyecto inexistente: 404. Proyecto existente pero no PUBLICADO: 409.
        - El registro de la clave y la donación se escriben en una única transacción condicionada.
        - La clave se conserva 24 horas (TTL).
      operationId: createDonation
      security:
        - CognitoBearer: [api/donations.write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID generado por el cliente para cada intención de donación distinta.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDonationRequest'
      responses:
        '201':
          description: Intención registrada en estado PENDIENTE_SIMULACION (o respuesta almacenada ante una repetición idéntica).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationCreatedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/donations/{donationId}/simulate:
    post:
      tags: [Donaciones]
      summary: Simular la confirmación o el rechazo de una donación propia
      description: |
        Solo el grupo DONANTE y solo sobre sus propias donaciones. La ruta existe únicamente en el stage
        `academic` (condición `IsAcademicStage` de la plantilla SAM); en otro stage no se despliega. Solo la
        primera transición desde PENDIENTE_SIMULACION es válida: la actualización de la donación y el
        incremento de `confirmedAmountCents` se hacen en una transacción condicionada, y cualquier solicitud
        repetida o concurrente recibe 409. Un rechazo no modifica el acumulado.

        Una donación ajena devuelve 403 (decisión del Policy Engine); un identificador inexistente devuelve 404.
      operationId: simulateDonation
      security:
        - CognitoBearer: [api/donations.write]
      parameters:
        - name: donationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateDonationRequest'
      responses:
        '200':
          description: Donación movida al estado terminal solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateDonationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/donations/me:
    get:
      tags: [Donaciones]
      summary: Historial propio de donaciones
      description: |
        Solo el grupo DONANTE. Devuelve únicamente las donaciones del `sub` autenticado, de la más reciente
        a la más antigua. Un usuario de otro grupo (por ejemplo GESTOR) recibe 403.
      operationId: listMyDonations
      security:
        - CognitoBearer: [api/donations.read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/NextToken'
      responses:
        '200':
          description: Página del historial del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/audit:
    get:
      tags: [Auditoría]
      summary: Consultar eventos de auditoría
      description: |
        Solo el grupo AUDITOR. Sin `eventType` se consulta el índice global `AllAuditLogsIndex`; con
        `eventType` se consulta la tabla por su clave de partición. El segundo factor (TOTP) de AUDITOR se
        exige en Cognito, no mediante un claim del token. Los eventos no contienen tokens, claves ni datos
        financieros, y el actor está seudonimizado. Las consultas exitosas no generan eventos; las rechazadas
        después de autenticar (403, 400, 5xx) quedan registradas como `LIST_AUDIT_LOGS` de tipo `AUDIT_EVENT`.
      operationId: listAuditLogs
      security:
        - CognitoBearer: [api/audit.read]
      parameters:
        - name: eventType
          in: query
          required: false
          description: Tipo de evento. Los handlers actuales emiten `PROJECT_EVENT`, `DONATION_EVENT` y `AUDIT_EVENT` (consultas de auditoría rechazadas).
          schema:
            type: string
            minLength: 1
            maxLength: 64
            examples: [PROJECT_EVENT, DONATION_EVENT, AUDIT_EVENT]
        - name: from
          in: query
          required: false
          description: Límite inferior (inclusive), fecha-hora ISO 8601 con `Z` o desplazamiento. Se normaliza a UTC.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Límite superior (inclusive), fecha-hora ISO 8601 con `Z` o desplazamiento. Debe ser igual o posterior a `from`.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/NextToken'
      responses:
        '200':
          description: Eventos de auditoría, del más reciente al más antiguo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    CognitoBearer:
      type: openIdConnect
      openIdConnectUrl: https://cognito-idp.us-east-2.amazonaws.com/us-east-2_EXAMPLE/.well-known/openid-configuration
      description: |
        Access token de Amazon Cognito (Authorization Code + PKCE) enviado como `Authorization: Bearer <access_token>`.
        Scopes del resource server `api`: `api/projects.write`, `api/donations.write`, `api/donations.read`
        y `api/audit.read`. Un ID token no es una credencial válida para la API. El valor `us-east-2_EXAMPLE`
        de la URL es un marcador: el identificador real del user pool se obtiene de la salida
        `CognitoUserPoolId` de la pila.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        examples: [prj_4a8f9c12e345]
    Limit:
      name: limit
      in: query
      required: false
      description: Tamaño de página, entero entre 1 y 100. Un valor fuera de rango o no numérico devuelve 400.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    NextToken:
      name: nextToken
      in: query
      required: false
      description: Token opaco de paginación devuelto por la página anterior (1 a 2048 caracteres).
      schema:
        type: string
        minLength: 1
        maxLength: 2048

  responses:
    ValidationError:
      description: |
        Entrada inválida: cuerpo JSON malformado, campo fuera de rango, `Idempotency-Key` ausente o que no
        es un UUID, o parámetro de consulta inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    Unauthorized:
      description: |
        Token ausente, expirado, alterado, emitido para otro app client o de otro emisor. Lo genera API
        Gateway antes de invocar a Lambda; el cuerpo observado es `{"message":"Unauthorized"}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayMessage'
    Forbidden:
      description: |
        Privilegio insuficiente. Puede originarse en API Gateway (token válido sin el scope exigido por la
        ruta; cuerpo `GatewayMessage`) o en Lambda (scope reverificado, grupo no permitido, donación ajena
        o stage distinto de `academic`; cuerpo `ErrorPayload`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorPayload'
              - $ref: '#/components/schemas/GatewayMessage'
    NotFound:
      description: Recurso inexistente (o proyecto no publicado, en las rutas públicas).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    Conflict:
      description: |
        Conflicto de estado: proyecto ya publicado o no publicado, donación ya procesada (incluidas las
        solicitudes concurrentes) o `Idempotency-Key` reutilizada con otro cuerpo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    TooManyRequests:
      description: Límite de tasa del stage superado. Lo genera API Gateway.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayMessage'
    InternalError:
      description: Error interno enmascarado (incluye un fallo del Policy Engine, que falla cerrado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'

  schemas:
    ErrorPayload:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, INTERNAL_ERROR]
          examples: [NOT_FOUND]
        message:
          type: string
          examples: [El proyecto no existe o no se encuentra publicado.]
        requestId:
          type: string
          description: Identificador de solicitud de API Gateway, presente también en los logs.

    GatewayMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
          examples: [Unauthorized]

    CreateProjectRequest:
      type: object
      required: [title, description, purpose, goalAmountCents]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          examples: [Comedor comunitario Arequipa]
        description:
          type: string
          minLength: 10
          examples: [Raciones diarias para familias del distrito.]
        purpose:
          type: string
          minLength: 5
          examples: [Alimentación]
        goalAmountCents:
          type: integer
          minimum: 1
          description: Meta en céntimos de PEN (entero positivo, sin máximo definido en el backend).
          examples: [500000]

    Project:
      type: object
      required:
        - projectId
        - title
        - description
        - purpose
        - goalAmountCents
        - confirmedAmountCents
        - currency
        - status
        - createdBy
        - createdAt
        - updatedAt
      properties:
        projectId:
          type: string
          examples: [prj_4a8f9c12e345]
        title:
          type: string
        description:
          type: string
        purpose:
          type: string
        goalAmountCents:
          type: integer
          examples: [500000]
        confirmedAmountCents:
          type: integer
          description: Suma de donaciones CONFIRMADA_SIMULADA, en céntimos.
          examples: [125000]
        currency:
          type: string
          enum: [PEN]
        status:
          type: string
          enum: [BORRADOR, PUBLICADO]
        createdBy:
          type: string
          description: '`sub` del gestor que creó el proyecto (la respuesta actual lo incluye).'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          description: Presente solo cuando el proyecto fue publicado.

    ProjectSummary:
      type: object
      description: Elemento del catálogo público; no incluye descripción ni autor.
      required:
        - projectId
        - title
        - purpose
        - goalAmountCents
        - confirmedAmountCents
        - currency
        - status
        - createdAt
      properties:
        projectId:
          type: string
          examples: [prj_4a8f9c12e345]
        title:
          type: string
        purpose:
          type: string
        goalAmountCents:
          type: integer
        confirmedAmountCents:
          type: integer
        currency:
          type: string
          enum: [PEN]
        status:
          type: string
          enum: [PUBLICADO]
        createdAt:
          type: string
          format: date-time

    ProjectListResponse:
      type: object
      required: [items, nextToken]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        nextToken:
          type: [string, 'null']
          description: Token para la página siguiente; `null` si no hay más resultados.

    ProjectStatsResponse:
      type: object
      required: [projectId, goalAmountCents, confirmedAmountCents, currency, progress]
      properties:
        projectId:
          type: string
        goalAmountCents:
          type: integer
          examples: [500000]
        confirmedAmountCents:
          type: integer
          examples: [125000]
        currency:
          type: string
          enum: [PEN]
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Porcentaje de avance redondeado y acotado a 100.
          examples: [25]

    PublishProjectResponse:
      type: object
      required: [projectId, status, publishedAt, updatedAt]
      properties:
        projectId:
          type: string
        status:
          type: string
          enum: [PUBLICADO]
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDonationRequest:
      type: object
      required: [projectId, amountCents]
      properties:
        projectId:
          type: string
          minLength: 1
          examples: [prj_4a8f9c12e345]
        amountCents:
          type: integer
          minimum: 100
          maximum: 100000
          description: Importe en céntimos de PEN (S/ 1.00 a S/ 1,000.00). Debe ser un entero.
          examples: [2500]

    DonationCreatedResponse:
      type: object
      required: [donationId, projectId, amountCents, currency, status, createdAt]
      properties:
        donationId:
          type: string
          examples: [don_91a82c3d4e5f]
        projectId:
          type: string
        amountCents:
          type: integer
        currency:
          type: string
          enum: [PEN]
        status:
          type: string
          enum: [PENDIENTE_SIMULACION]
        createdAt:
          type: string
          format: date-time

    SimulateDonationRequest:
      type: object
      required: [result]
      properties:
        result:
          type: string
          enum: [CONFIRMADA_SIMULADA, RECHAZADA_SIMULADA]

    SimulateDonationResponse:
      type: object
      required: [donationId, status, updatedAt]
      properties:
        donationId:
          type: string
        status:
          type: string
          enum: [CONFIRMADA_SIMULADA, RECHAZADA_SIMULADA]
        updatedAt:
          type: string
          format: date-time

    DonationSummary:
      type: object
      description: Elemento del historial propio; no incluye `donorSub`.
      required: [donationId, projectId, amountCents, currency, status, createdAt, updatedAt]
      properties:
        donationId:
          type: string
        projectId:
          type: string
        amountCents:
          type: integer
        currency:
          type: string
          enum: [PEN]
        status:
          type: string
          enum: [PENDIENTE_SIMULACION, CONFIRMADA_SIMULADA, RECHAZADA_SIMULADA]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DonationListResponse:
      type: object
      required: [items, nextToken]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DonationSummary'
        nextToken:
          type: [string, 'null']

    AuditEvent:
      type: object
      required:
        - eventType
        - timestampEventId
        - timestamp
        - eventId
        - requestId
        - actorRef
        - action
        - resourceRef
        - outcome
      properties:
        eventType:
          type: string
          examples: [DONATION_EVENT]
        timestampEventId:
          type: string
          description: Clave de ordenación `<timestamp>#<eventId>`.
        timestamp:
          type: string
          format: date-time
        eventId:
          type: string
          format: uuid
        requestId:
          type: string
        actorRef:
          type: string
          description: |
            Seudónimo del actor (`actor_` más 8 caracteres de un hash SHA-256 del `sub`), o la constante
            `actor_unknown` cuando la solicitud no trae una identidad verificada.
          examples: [actor_a1b2c3d4]
        action:
          type: string
          description: Acciones emitidas actualmente por los handlers protegidos.
          examples: [CREATE_PROJECT, PUBLISH_PROJECT, CREATE_DONATION_INTENT, SIMULATE_DONATION, LIST_MY_DONATIONS, LIST_AUDIT_LOGS]
        resourceRef:
          type: string
          description: |
            Identificador del recurso afectado (proyecto o donación). Es `n/a` si la operación rechazada no tiene
            recurso identificable, e `invalid` si el identificador del path no tiene la forma esperada.
          examples: [don_91a82c3d4e5f]
        outcome:
          type: string
          enum: [SUCCESS, FAILURE, DENIED, ERROR]
          description: |
            `SUCCESS`: operación completada. `DENIED`: autorización o identidad rechazada (401/403).
            `FAILURE`: rechazo de validación o de negocio (400, 404, 409). `ERROR`: fallo inesperado (5xx).
            Un fallo al escribir el evento nunca cambia la respuesta HTTP.

    AuditListResponse:
      type: object
      required: [items, nextToken]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextToken:
          type: [string, 'null']
