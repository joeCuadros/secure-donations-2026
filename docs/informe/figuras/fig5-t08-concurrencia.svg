<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t5 d5">
  <title id="t5">T08: diez confirmaciones concurrentes de una misma donación</title>
  <desc id="d5">Diez solicitudes simultáneas llegan a una transacción condicionada de DynamoDB; una devuelve 200 y nueve devuelven 409; el total del proyecto sube 1000 céntimos una sola vez y la auditoría registra un SUCCESS y nueve FAILURE.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .w  { fill: #ffffff; }
      .tt { font-size: 18px; font-weight: 700; }
      .tm { font-size: 17px; font-weight: 700; }
      .ts { font-size: 16px; }
      .lbl { font-size: 16px; font-weight: 600; fill: #1f2937; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .ln { fill: none; stroke: #1f2937; stroke-width: 2.2; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>

  <!-- Solicitudes -->
  <rect x="15" y="20" width="290" height="310" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="160" y="46" class="tt" text-anchor="middle" fill="#111827">10 solicitudes en paralelo</text>
  <text x="160" y="68" class="ts" text-anchor="middle" fill="#1f2937">POST …/simulate · misma donación</text>
  <g class="w" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="35" y="86" width="110" height="38" rx="6" fill="#44525e"/><text x="90" y="110">#1</text>
    <rect x="175" y="86" width="110" height="38" rx="6" fill="#44525e"/><text x="230" y="110">#2</text>
    <rect x="35" y="134" width="110" height="38" rx="6" fill="#44525e"/><text x="90" y="158">#3</text>
    <rect x="175" y="134" width="110" height="38" rx="6" fill="#44525e"/><text x="230" y="158">#4</text>
    <rect x="35" y="182" width="110" height="38" rx="6" fill="#44525e"/><text x="90" y="206">#5</text>
    <rect x="175" y="182" width="110" height="38" rx="6" fill="#44525e"/><text x="230" y="206">#6</text>
    <rect x="35" y="230" width="110" height="38" rx="6" fill="#44525e"/><text x="90" y="254">#7</text>
    <rect x="175" y="230" width="110" height="38" rx="6" fill="#44525e"/><text x="230" y="254">#8</text>
    <rect x="35" y="278" width="110" height="38" rx="6" fill="#44525e"/><text x="90" y="302">#9</text>
    <rect x="175" y="278" width="110" height="38" rx="6" fill="#44525e"/><text x="230" y="302">#10</text>
  </g>

  <!-- Flechas -->
  <path class="ln" d="M305,195 H340" marker-end="url(#a)"/>
  <path class="ln" d="M600,115 H700" marker-end="url(#a)"/>
  <path class="ln" d="M600,285 H700" marker-end="url(#a)"/>
  <path class="ln" d="M470,290 V350" marker-end="url(#a)"/>
  <path class="ln" d="M960,115 H978 V452 H960" marker-end="url(#a)"/>
  <path class="ln" d="M960,285 H978"/>
  <text class="lbl" x="650" y="104" text-anchor="middle">1 intento</text>
  <text class="lbl" x="650" y="274" text-anchor="middle">9 intentos</text>
  <text class="lbl" x="482" y="326">solo en la ganadora</text>

  <!-- Transacción -->
  <rect x="340" y="100" width="260" height="190" rx="8" fill="#1e2a4a"/>
  <text class="tt w" x="470" y="128" text-anchor="middle">Amazon DynamoDB</text>
  <text class="tm w" x="470" y="152" text-anchor="middle">TransactWriteItems</text>
  <text class="ts w" x="470" y="176" text-anchor="middle">Donations + Projects</text>
  <text class="ts w" x="470" y="206" text-anchor="middle">Condición:</text>
  <text class="ts w" x="470" y="228" text-anchor="middle">status = PENDIENTE_SIMULACION</text>
  <text class="ts w" x="470" y="250" text-anchor="middle">AND donorSub = :sub</text>

  <!-- Resultados -->
  <rect x="700" y="60" width="260" height="110" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text class="tt" x="830" y="90" text-anchor="middle" fill="#14532d">1 × 200 OK</text>
  <text class="ts" x="830" y="114" text-anchor="middle" fill="#14532d">primera transición válida</text>
  <text class="ts" x="830" y="136" text-anchor="middle" fill="#14532d">PENDIENTE_SIMULACION →</text>
  <text class="ts" x="830" y="158" text-anchor="middle" fill="#14532d">CONFIRMADA_SIMULADA</text>

  <rect x="700" y="220" width="260" height="130" rx="8" fill="#fde2e2" stroke="#b91c1c" stroke-width="2"/>
  <text class="tt" x="830" y="250" text-anchor="middle" fill="#7f1d1d">9 × 409 Conflict</text>
  <text class="ts" x="830" y="274" text-anchor="middle" fill="#7f1d1d">la condición ya no se cumple:</text>
  <text class="ts" x="830" y="296" text-anchor="middle" fill="#7f1d1d">TransactionCanceledException</text>
  <text class="ts" x="830" y="318" text-anchor="middle" fill="#7f1d1d">se traduce a 409, no a 500</text>

  <!-- Efectos -->
  <rect x="340" y="350" width="260" height="116" rx="8" fill="#1e2a4a"/>
  <text class="tt w" x="470" y="378" text-anchor="middle">Tabla Projects</text>
  <text class="ts w" x="470" y="402" text-anchor="middle">confirmedAmountCents</text>
  <text class="tm w" x="470" y="426" text-anchor="middle">+1000 céntimos (S/ 10.00)</text>
  <text class="ts w" x="470" y="450" text-anchor="middle">un solo incremento</text>

  <rect x="700" y="398" width="260" height="110" rx="8" fill="#e3e9f6" stroke="#1e2a4a" stroke-width="2"/>
  <text class="tt" x="830" y="426" text-anchor="middle" fill="#1e2a4a">AuditEvents</text>
  <text class="ts" x="830" y="450" text-anchor="middle" fill="#1f2937">1 × SUCCESS (la 200)</text>
  <text class="ts" x="830" y="472" text-anchor="middle" fill="#1f2937">9 × FAILURE (las 409)</text>
  <text class="ts" x="830" y="494" text-anchor="middle" fill="#1f2937">un evento por solicitud</text>

  <!-- Nota de contexto -->
  <rect x="15" y="360" width="290" height="148" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="tm" x="30" y="388" fill="#111827">Prueba T08</text>
  <text class="ts" x="30" y="412" fill="#1f2937">Ejecución del 2026-11-11 contra</text>
  <text class="ts" x="30" y="434" fill="#1f2937">el stage academic (us-east-2).</text>
  <text class="ts" x="30" y="458" fill="#1f2937">Las 10 solicitudes parten de la</text>
  <text class="ts" x="30" y="480" fill="#1f2937">misma donación pendiente.</text>

  <rect x="15" y="530" width="970" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="tm" x="500" y="561" text-anchor="middle" fill="#111827">Resultado: una sola transición, un solo incremento (+1000 céntimos) y diez eventos de auditoría</text>
</svg>
