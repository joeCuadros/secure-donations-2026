<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1340" viewBox="0 0 1000 1340" role="img" aria-labelledby="t2 d2">
  <title id="t2">Flujo de una donación simulada</title>
  <desc id="d2">Diagrama de secuencia entre SPA, Cognito, API Gateway, Lambda, Verified Permissions y DynamoDB: inicio de sesión, creación de la intención de donación y simulación de la confirmación.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .h  { font-size: 17px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
      .hd { font-size: 17px; font-weight: 700; text-anchor: middle; fill: #0b2f2c; }
      .lbl { font-size: 16px; fill: #1f2937; paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
      .m  { fill: none; stroke: #1f2937; stroke-width: 2.2; }
      .r  { fill: none; stroke: #4b5563; stroke-width: 2; stroke-dasharray: 7 4; }
      .life { stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 5 5; }
      .band { fill: #e8eef5; }
      .bt { font-size: 16px; font-weight: 700; fill: #334155; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1000" height="1340" fill="#ffffff"/>

  <!-- Líneas de vida -->
  <line class="life" x1="90" y1="71" x2="90" y2="1325"/>
  <line class="life" x1="310" y1="71" x2="310" y2="1325"/>
  <line class="life" x1="470" y1="71" x2="470" y2="1325"/>
  <line class="life" x1="630" y1="71" x2="630" y2="1325"/>
  <line class="life" x1="780" y1="71" x2="780" y2="1325"/>
  <line class="life" x1="925" y1="71" x2="925" y2="1325"/>

  <!-- Cabeceras -->
  <rect x="20" y="15" width="140" height="56" rx="8" fill="#44525e"/>
  <text class="h" x="90" y="49">SPA React</text>
  <rect x="240" y="15" width="140" height="56" rx="8" fill="#0f766e"/>
  <text class="h" x="310" y="49">Cognito</text>
  <rect x="400" y="15" width="140" height="56" rx="8" fill="#c2410c"/>
  <text class="h" x="470" y="40">API</text>
  <text class="h" x="470" y="60">Gateway</text>
  <rect x="560" y="15" width="140" height="56" rx="8" fill="#1e2a4a"/>
  <text class="h" x="630" y="49">Lambda</text>
  <rect x="715" y="15" width="130" height="56" rx="8" fill="#b2e0dc" stroke="#0f766e" stroke-width="2"/>
  <text class="hd" x="780" y="40">Verified</text>
  <text class="hd" x="780" y="60">Permissions</text>
  <rect x="860" y="15" width="130" height="56" rx="8" fill="#1e2a4a"/>
  <text class="h" x="925" y="49">DynamoDB</text>

  <!-- Fase 1 -->
  <rect class="band" x="10" y="82" width="980" height="26" rx="4"/>
  <text class="bt" x="20" y="101">1 · Inicio de sesión (Authorization Code + PKCE, MFA TOTP)</text>
  <path class="m" d="M90,160 H310" marker-end="url(#a)"/>
  <text class="lbl" x="100" y="134">Authorization Code + PKCE</text>
  <text class="lbl" x="100" y="152">contraseña + código TOTP</text>
  <path class="r" d="M310,206 H90" marker-end="url(#ar)"/>
  <text class="lbl" x="100" y="180">access token (15 min)</text>
  <text class="lbl" x="100" y="198">solo en memoria</text>

  <!-- Fase 2 -->
  <rect class="band" x="10" y="224" width="980" height="26" rx="4"/>
  <text class="bt" x="20" y="243">2 · Crear la intención de donación</text>
  <path class="m" d="M90,312 H470" marker-end="url(#a)"/>
  <text class="lbl" x="100" y="286">POST /v1/donations</text>
  <text class="lbl" x="100" y="304">Bearer access token · Idempotency-Key</text>

  <rect x="330" y="328" width="280" height="68" rx="6" fill="#fde8d8" stroke="#c2410c" stroke-width="1.6"/>
  <text x="470" y="348" font-size="16" text-anchor="middle" fill="#7c2d12">JWT authorizer: firma, emisor,</text>
  <text x="470" y="367" font-size="16" text-anchor="middle" fill="#7c2d12">expiración, client_id y scope</text>
  <text x="470" y="386" font-size="16" text-anchor="middle" fill="#7c2d12">(si falla: 401 o 403)</text>

  <path class="m" d="M470,444 H630" marker-end="url(#a)"/>
  <text class="lbl" x="480" y="418">invoca con los</text>
  <text class="lbl" x="480" y="436">claims verificados</text>

  <path class="m" d="M630,504 H925" marker-end="url(#a)"/>
  <text class="lbl" x="640" y="478">GetItem: clave de idempotencia</text>
  <text class="lbl" x="640" y="496">y proyecto PUBLICADO</text>

  <path class="m" d="M630,564 H780" marker-end="url(#a)"/>
  <text class="lbl" x="640" y="538">IsAuthorized</text>
  <text class="lbl" x="640" y="556">(CreateDonation)</text>
  <path class="r" d="M780,600 H630" marker-end="url(#ar)"/>
  <text class="lbl" x="640" y="592">ALLOW</text>

  <path class="m" d="M630,692 H925" marker-end="url(#a)"/>
  <text class="lbl" x="640" y="638">TransactWriteItems</text>
  <text class="lbl" x="640" y="656">Idempotency + Donation</text>
  <text class="lbl" x="640" y="674">(PENDIENTE_SIMULACION)</text>

  <path class="m" d="M630,738 H925" marker-end="url(#a)"/>
  <text class="lbl" x="640" y="730">PutItem AuditEvents (SUCCESS)</text>

  <path class="r" d="M630,786 H90" marker-end="url(#ar)"/>
  <text class="lbl" x="100" y="778">201 Created (vía API Gateway)</text>

  <!-- Fase 3 -->
  <rect class="band" x="10" y="808" width="980" height="26" rx="4"/>
  <text class="bt" x="20" y="827">3 · Simular la confirmación (solo en el stage academic)</text>
  <path class="m" d="M90,902 H470" marker-end="url(#a)"/>
  <text class="lbl" x="100" y="876">POST /v1/donations/{id}/simulate</text>
  <text class="lbl" x="100" y="894">Bearer access token</text>

  <path class="m" d="M470,956 H630" marker-end="url(#a)"/>
  <text class="lbl" x="480" y="930">valida el JWT y</text>
  <text class="lbl" x="480" y="948">reenvía los claims</text>

  <path class="m" d="M630,1016 H925" marker-end="url(#a)"/>
  <text class="lbl" x="640" y="990">GetItem Donations</text>
  <text class="lbl" x="640" y="1008">(propietario y estado)</text>

  <path class="m" d="M630,1086 H780" marker-end="url(#a)"/>
  <text class="lbl" x="640" y="1060">IsAuthorized (SimulateDonation)</text>
  <text class="lbl" x="640" y="1078">principal.sub == resource.donorSub</text>
  <path class="r" d="M780,1122 H630" marker-end="url(#ar)"/>
  <text class="lbl" x="640" y="1114">ALLOW</text>

  <path class="m" d="M630,1214 H925" marker-end="url(#a)"/>
  <text class="lbl" x="640" y="1160">TransactWriteItems condicional</text>
  <text class="lbl" x="640" y="1178">status = PENDIENTE y donorSub = :sub</text>
  <text class="lbl" x="640" y="1196">+ confirmedAmountCents del proyecto</text>

  <path class="m" d="M630,1260 H925" marker-end="url(#a)"/>
  <text class="lbl" x="640" y="1252">PutItem AuditEvents (SUCCESS)</text>

  <path class="r" d="M630,1308 H90" marker-end="url(#ar)"/>
  <text class="lbl" x="100" y="1300">200 OK · CONFIRMADA_SIMULADA (vía API Gateway)</text>
</svg>
