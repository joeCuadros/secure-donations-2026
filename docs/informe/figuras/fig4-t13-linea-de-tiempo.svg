<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="t4 d4">
  <title id="t4">T13: token revocado aceptado hasta su expiración</title>
  <desc id="d4">Línea de tiempo en UTC del 2026-11-11. El access token revocado a las 19:57:00 sigue dando 200 hasta que expira a las 20:11:48; a las 20:11:50 la API responde 401.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .tb { font-size: 16px; font-weight: 700; fill: #111827; }
      .tn { font-size: 16px; fill: #1f2937; }
      .tr { font-size: 16px; font-weight: 700; fill: #991b1b; }
      .tk { font-size: 16px; fill: #374151; text-anchor: middle; }
      .stem { stroke: #6b7280; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect width="1000" height="580" fill="#ffffff"/>

  <text x="990" y="26" font-size="16" font-weight="700" text-anchor="end" fill="#374151">2026-11-11 · hora UTC</text>
  <circle cx="738" cy="46" r="6" fill="#15803d"/>
  <text class="tn" x="750" y="52">respuesta 200</text>
  <circle cx="738" cy="68" r="6" fill="#b91c1c"/>
  <text class="tn" x="750" y="74">revocación o rechazo 401</text>
  <circle cx="738" cy="90" r="6" fill="#374151"/>
  <text class="tn" x="750" y="96">expiración del token</text>

  <!-- Ventana de exposición -->
  <rect x="104.5" y="236" width="807.3" height="128" fill="#fde2e2" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="560" y="259" font-size="18" font-weight="700" text-anchor="middle" fill="#991b1b">Ventana de exposición: ≈ 15 min</text>
  <text x="560" y="279" font-size="16" text-anchor="middle" fill="#991b1b">el access token revocado sigue aceptado hasta expirar</text>

  <!-- Eje -->
  <rect x="50" y="295" width="900" height="10" fill="#475569"/>
  <g stroke="#475569" stroke-width="1.6">
    <line x1="50" y1="305" x2="50" y2="315"/>
    <line x1="104.5" y1="305" x2="104.5" y2="312"/>
    <line x1="159" y1="305" x2="159" y2="312"/>
    <line x1="213.6" y1="305" x2="213.6" y2="312"/>
    <line x1="268.2" y1="305" x2="268.2" y2="315"/>
    <line x1="322.7" y1="305" x2="322.7" y2="312"/>
    <line x1="377.3" y1="305" x2="377.3" y2="312"/>
    <line x1="431.8" y1="305" x2="431.8" y2="312"/>
    <line x1="486.4" y1="305" x2="486.4" y2="312"/>
    <line x1="541" y1="305" x2="541" y2="315"/>
    <line x1="595.5" y1="305" x2="595.5" y2="312"/>
    <line x1="650.1" y1="305" x2="650.1" y2="312"/>
    <line x1="704.6" y1="305" x2="704.6" y2="312"/>
    <line x1="759.2" y1="305" x2="759.2" y2="312"/>
    <line x1="813.6" y1="305" x2="813.6" y2="315"/>
    <line x1="868.2" y1="305" x2="868.2" y2="312"/>
    <line x1="922.7" y1="305" x2="922.7" y2="312"/>
  </g>
  <text class="tk" x="50" y="336">19:56</text>
  <text class="tk" x="268.2" y="336">20:00</text>
  <text class="tk" x="541" y="336">20:05</text>
  <text class="tk" x="813.6" y="336">20:10</text>

  <!-- Eventos por encima del eje -->
  <line class="stem" x1="93.6" y1="300" x2="93.6" y2="62"/>
  <text class="tb" x="102" y="76">19:56:48 · token vigente</text>
  <text class="tn" x="102" y="96">GET /v1/donations/me → 200</text>

  <line class="stem" x1="104.5" y1="300" x2="104.5" y2="112"/>
  <text class="tr" x="113" y="126">≈ 19:57:00 · revocación del refresh token</text>
  <text class="tn" x="113" y="146">/oauth2/revoke → 200</text>

  <line class="stem" x1="135.5" y1="300" x2="135.5" y2="162"/>
  <text class="tb" x="144" y="176">19:57:34 · mismo token</text>
  <text class="tn" x="144" y="196">→ 200 tras la revocación</text>

  <line class="stem" x1="911.8" y1="300" x2="911.8" y2="112"/>
  <text class="tb" x="903" y="126" text-anchor="end">20:11:48 · expira el access token</text>
  <text class="tn" x="903" y="146" text-anchor="end">vigencia de 15 minutos</text>

  <!-- Eventos por debajo del eje -->
  <line class="stem" x1="432" y1="300" x2="432" y2="372"/>
  <text class="tb" x="441" y="386">20:02:58 · 20:03:01 · 20:03:02</text>
  <text class="tn" x="441" y="406">mismo token → 200 (tres llamadas)</text>

  <line class="stem" x1="363.6" y1="300" x2="363.6" y2="426"/>
  <text class="tb" x="372" y="440">20:01:45 · mismo token → 200</text>

  <line class="stem" x1="108.2" y1="300" x2="108.2" y2="478"/>
  <text class="tb" x="117" y="492">19:57:04 · mismo token, ya revocado</text>
  <text class="tn" x="117" y="512">→ 200: se acepta tras la revocación</text>

  <line class="stem" x1="913.6" y1="300" x2="913.6" y2="426"/>
  <text class="tr" x="905" y="440" text-anchor="end">20:11:50 · mismo token → 401</text>
  <text class="tn" x="905" y="460" text-anchor="end">dos segundos tras expirar</text>

  <!-- Evento sin hora -->
  <rect x="480" y="486" width="510" height="64" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text class="tb" x="494" y="512">Sin hora registrada (posterior a la revocación)</text>
  <text class="tn" x="494" y="534">renovar con el refresh token revocado → invalid_grant</text>

  <!-- Puntos de evento -->
  <circle cx="93.6" cy="300" r="6" fill="#15803d"/>
  <circle cx="108.2" cy="300" r="5" fill="#15803d"/>
  <circle cx="104.5" cy="300" r="5" fill="#b91c1c"/>
  <circle cx="135.5" cy="300" r="6" fill="#15803d"/>
  <circle cx="363.6" cy="300" r="6" fill="#15803d"/>
  <circle cx="430" cy="300" r="4.5" fill="#15803d"/>
  <circle cx="432.7" cy="300" r="4.5" fill="#15803d"/>
  <circle cx="433.6" cy="300" r="4.5" fill="#15803d"/>
  <circle cx="911.8" cy="300" r="6" fill="#374151"/>
  <circle cx="914" cy="300" r="4" fill="#b91c1c"/>
</svg>
