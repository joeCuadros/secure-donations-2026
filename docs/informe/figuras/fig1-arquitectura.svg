<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 48 1000 960" role="img" aria-labelledby="t1 d1">
  <title id="t1">Arquitectura Zero Trust de AQP-SOLIDARIA</title>
  <desc id="d1">Navegador y SPA React no confiables; CloudFront con S3 privado; Cognito como PA; API Gateway como PEP; Lambda; Verified Permissions como PE; DynamoDB; CloudWatch Logs y CloudTrail.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .t  { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .t2 { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .s  { font-size: 16px; text-anchor: middle; }
      .w  { fill: #ffffff; }
      .d  { fill: #0b2f2c; }
      .g  { fill: #1f2937; }
      .lbl { font-size: 16px; fill: #1f2937; paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
      .reg { font-size: 17px; font-style: italic; fill: #475569; }
      .ln { fill: none; stroke: #1f2937; stroke-width: 2.2; }
      .lnd { fill: none; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1010" fill="#ffffff"/>

  <!-- Fronteras de confianza -->
  <rect x="10" y="60" width="235" height="600" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="9 6"/>
  <text class="reg" x="22" y="84">Navegador (no confiable)</text>
  <rect x="270" y="60" width="720" height="810" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="9 6"/>
  <text class="reg" x="284" y="84">AWS · us-east-2</text>

  <!-- Flechas (debajo de las cajas) -->
  <path class="ln" d="M220,130 H420" marker-end="url(#a)"/>
  <path class="ln" d="M420,176 H122 V330" marker-end="url(#a)"/>
  <path class="ln" d="M220,380 H420" marker-end="url(#a)"/>
  <path class="ln" d="M122,430 V590 H420" marker-end="url(#a)"/>
  <path class="ln" d="M690,590 H740" marker-end="url(#a)"/>
  <path class="ln" d="M860,540 V430" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M860,650 V730" marker-end="url(#a)"/>
  <path class="lnd" d="M555,640 V730" marker-end="url(#ag)"/>
  <path class="lnd" d="M770,650 V690 H640 V730" marker-end="url(#ag)"/>

  <!-- Etiquetas de flechas -->
  <text class="lbl" x="330" y="120" text-anchor="middle">HTTPS</text>
  <text class="lbl" x="134" y="262">entrega la SPA</text>
  <text class="lbl" x="335" y="358" text-anchor="middle">Authorization Code</text>
  <text class="lbl" x="335" y="375" text-anchor="middle">+ PKCE</text>
  <text class="lbl" x="318" y="580" text-anchor="middle">Bearer access token</text>
  <text class="lbl" x="872" y="492">IsAuthorized</text>
  <text class="lbl" x="872" y="683">rol IAM mínimo</text>
  <text class="lbl" x="872" y="701">por función</text>
  <text class="lbl" x="543" y="692" text-anchor="end">log de acceso</text>
  <text class="lbl" x="655" y="682">logs JSON</text>

  <!-- Cajas -->
  <rect x="25" y="100" width="195" height="60" rx="8" fill="#44525e"/>
  <text class="t w" x="122.5" y="127">Usuario</text>
  <text class="s w" x="122.5" y="148">navegador web</text>

  <rect x="25" y="330" width="195" height="100" rx="8" fill="#44525e"/>
  <text class="t w" x="122.5" y="365">SPA React</text>
  <text class="s w" x="122.5" y="388">no confiable</text>
  <text class="s w" x="122.5" y="410">tokens en memoria</text>

  <rect x="420" y="95" width="270" height="100" rx="8" fill="#2f5d8a"/>
  <text class="t w" x="555" y="132">CloudFront + S3 privado</text>
  <text class="s w" x="555" y="158">OAC · cabeceras de seguridad</text>

  <rect x="420" y="330" width="270" height="100" rx="8" fill="#0f766e"/>
  <text class="t w" x="555" y="367">Amazon Cognito</text>
  <text class="s w" x="555" y="393">PA · OIDC + PKCE + MFA TOTP</text>

  <rect x="420" y="540" width="270" height="100" rx="8" fill="#c2410c"/>
  <text class="t w" x="555" y="577">API Gateway HTTP API</text>
  <text class="s w" x="555" y="603">PEP 1 · JWT + scopes</text>

  <rect x="740" y="330" width="240" height="100" rx="8" fill="#b2e0dc" stroke="#0f766e" stroke-width="2"/>
  <text class="t d" x="860" y="367">Verified Permissions</text>
  <text class="s d" x="860" y="393">PE · Cedar, 7 políticas</text>

  <rect x="740" y="540" width="240" height="110" rx="8" fill="#1e2a4a"/>
  <text class="t w" x="860" y="574">AWS Lambda</text>
  <text class="s w" x="860" y="600">authz · Node.js 24</text>
  <text class="s w" x="860" y="624">PEP 2 · aplica la decisión</text>

  <rect x="740" y="730" width="240" height="120" rx="8" fill="#1e2a4a"/>
  <text class="t w" x="860" y="766">Amazon DynamoDB</text>
  <text class="s w" x="860" y="793">Projects · Donations</text>
  <text class="s w" x="860" y="816">Idempotency · AuditEvents</text>

  <rect x="420" y="730" width="270" height="100" rx="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="t2 g" x="555" y="773">CloudWatch Logs / CloudTrail</text>
  <text class="s g" x="555" y="799">telemetría</text>

  <!-- Leyenda -->
  <rect x="10" y="890" width="980" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="25" y="914" font-size="16" font-weight="700" fill="#1f2937">Roles de NIST SP 800-207</text>
  <circle cx="33" cy="935" r="7" fill="#0f766e"/>
  <text x="50" y="941" font-size="16" fill="#1f2937"><tspan font-weight="700">PA</tspan> · Policy Administrator: Cognito emite, renueva y revoca los tokens de sesión</text>
  <circle cx="33" cy="957" r="7" fill="#c2410c"/>
  <text x="50" y="963" font-size="16" fill="#1f2937"><tspan font-weight="700">PEP</tspan> · Policy Enforcement Point: API Gateway (1) y el handler de Lambda (2) aplican la decisión</text>
  <circle cx="33" cy="979" r="7" fill="#b2e0dc" stroke="#0f766e" stroke-width="1.5"/>
  <text x="50" y="985" font-size="16" fill="#1f2937"><tspan font-weight="700">PE</tspan> · Policy Engine: Verified Permissions decide con políticas Cedar</text>
</svg>
